name: utms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-UTMS}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - utms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-utms-redis-development}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - utms-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-utms-redis-development}

  couchdb:
    image: couchdb:3.5.2.1
    environment:
      COUCHDB_USER: ${COUCHDB_USERNAME:-utms}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-utms-couchdb-development}
    ports:
      - "${COUCHDB_PORT:-5984}:5984"
    volumes:
      - utms-couchdb:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u '$${COUCHDB_USER}:$${COUCHDB_PASSWORD}' http://127.0.0.1:5984/_up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-utms-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-utms-minio-development}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - utms-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/$${S3_BUCKET}
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-utms-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-utms-minio-development}
      S3_BUCKET: ${S3_BUCKET:-utms-private}
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_CONSOLE_PORT: 4174
      API_CONSOLE_CORS_ORIGIN: ${API_CONSOLE_CORS_ORIGIN:-http://localhost:5173}
      API_CONSOLE_DATA_DIR: /app/runtime/api-console
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@postgres:5432/${POSTGRES_DB:-UTMS}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-utms-redis-development}@redis:6379
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-utms_playwright}
      COUCHDB_USERNAME: ${COUCHDB_USERNAME:-utms}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-utms-couchdb-development}
      CDE_SESSION_ENCRYPTION_KEY: ${CDE_SESSION_ENCRYPTION_KEY:-development-cde-session-encryption-key-change-me}
      UTMS_OBJECT_ENCRYPTION_KEY: ${UTMS_OBJECT_ENCRYPTION_KEY:-development-object-encryption-key-change-me}
      UTMS_INTERNAL_JOB_TOKEN: ${UTMS_INTERNAL_JOB_TOKEN:-utms-development-jobs}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-utms-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-utms-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-utms-minio-development}
    ports:
      - "${API_CONSOLE_PORT:-4174}:4174"
    volumes:
      - utms-api-console:/app/runtime/api-console
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      couchdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:4174/api/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    command: npm run dev -w @utms/web -- --host 0.0.0.0
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_CONSOLE_BASE_URL: /api/api-console
      VITE_DEV_API_PROXY_TARGET: http://api:4174
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5173', res => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: infrastructure/docker/worker/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://:${REDIS_PASSWORD:-utms-redis-development}@redis:6379
      UTMS_API_BASE_URL: http://api:4174
      UTMS_INTERNAL_JOB_TOKEN: ${UTMS_INTERNAL_JOB_TOKEN:-utms-development-jobs}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  playwright-runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: infrastructure/docker/playwright-runner/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@postgres:5432/${POSTGRES_DB:-UTMS}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-utms-redis-development}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-utms-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-utms-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-utms-minio-development}
      UTMS_OBJECT_ENCRYPTION_KEY: ${UTMS_OBJECT_ENCRYPTION_KEY:-development-object-encryption-key-change-me}
      PLAYWRIGHT_TEST_UID: 1001
      PLAYWRIGHT_TEST_GID: 1001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
      - /dev/shm:rw,nosuid,nodev,size=1g
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    cpus: "2.0"
    mem_limit: 4g

volumes:
  utms-postgres:
  utms-redis:
  utms-couchdb:
  utms-minio:
  utms-api-console:
