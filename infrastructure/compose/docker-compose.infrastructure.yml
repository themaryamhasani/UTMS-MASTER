services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: UTMS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - utms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UTMS"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  utms-postgres:
