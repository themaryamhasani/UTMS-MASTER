services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: UTMS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - utms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UTMS"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - utms-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  couchdb:
    image: couchdb:3.5.2.1
    environment:
      COUCHDB_USER: utms
      COUCHDB_PASSWORD: utms-couchdb-development
    ports:
      - "5984:5984"
    volumes:
      - utms-couchdb:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u '$${COUCHDB_USER}:$${COUCHDB_PASSWORD}' http://127.0.0.1:5984/_up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  utms-postgres:
  utms-redis:
  utms-couchdb:
